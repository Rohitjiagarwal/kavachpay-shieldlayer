    phrase: "ignore previous instructions"
    category: "instruction_override"
    severity: "high"
    owasp_ref: "LLM01"
    mitre_ref: "AML.T0051.000"
    description: "Classic direct instruction override"

  - id: ac_override_ignore_all_prev
