# ShieldLayer — Stage 1B Aho-Corasick Static Threat Signatures
#
# High-speed O(n) exact-match signatures mapped to:
# - OWASP Top 10 for LLM Applications 2025 (LLM01, LLM02, LLM06, LLM07)
# - OWASP Top 10 for Agentic Applications (ASI01, ASI02)
# - MITRE ATLAS (AML.T0051, AML.T0054, AML.T0057)

version: 1

signatures:
