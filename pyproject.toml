[project]
name = "kavachpay"
version = "0.3.0"
description = "KavachPay: a UPI support agent protected by ShieldLayer, a 3-layer zero-judge security pipeline (deterministic funnel -> quarantined intent extractor -> symbolic policy gate) + provenance origin gate."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "httpx>=0.27",
    "python-multipart>=0.0.12",
    "numpy>=2.0",
    "rich>=13.9",
    "pyahocorasick>=2.1.0",
    "confusable-homoglyphs>=3.3.1",
]

[project.optional-dependencies]
# Chatbot backend + RAG.
app = [
    "sqlalchemy>=2.0",
    "itsdangerous>=2.2",
    "fastembed>=0.4",
    "pymupdf>=1.24",
    "python-docx>=1.1",
]
# Lightweight API-only install for 512 MB free containers (uses hashing RAG fallback).
api-lite = [
    "sqlalchemy>=2.0",
    "itsdangerous>=2.2",
    "pymupdf>=1.24",
    "python-docx>=1.1",
]
# Heavy, optional document parser.
docling = [
    "docling>=2.0",
]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.7",
    "mypy>=1.13",
    "pip-audit>=2.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["shared", "shield", "app"]

[tool.pytest.ini_options]
testpaths = ["shield/tests", "app/tests"]
addopts = "-q"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# E501 line length (handled by formatter); B008 FastAPI Depends/Header pattern;
# UP042 str+Enum is intentional for pydantic JSON; B905 zip(strict=) not needed;
# E701/E702 compact one-liners; E741 single-letter locals in short scopes.
ignore = ["E501", "B008", "UP042", "B905", "E701", "E702", "E741"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
